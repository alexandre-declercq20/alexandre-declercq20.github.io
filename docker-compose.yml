version: '3.8'

services:

  # ── Serveur base de données MySQL ──
  db:
    image: mysql:10.6
    container_name: sae23_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123  
      MYSQL_DATABASE: sae23             
      MYSQL_USER: sae23_user              
      MYSQL_PASSWORD: 123        
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql           

  # ── Serveur Flask ──
  web:
    build: .                              
    container_name: sae23_flask
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    depends_on:
      - db                                
    volumes:
      - .:/app                            

# Volume pour persister les données MySQL
volumes:
  db_data:
